<?php if (!$isDealer && !$isApplying): ?>
<script>
(function(){
    function toast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(function(){t.classList.remove('show')},2200)}
    var btn=document.getElementById('d-submit');
    btn.addEventListener('click',function(){
        var name=(document.getElementById('d-name').value||'').trim();
        var mobile=(document.getElementById('d-mobile').value||'').trim();
        var read=document.getElementById('d-read').checked;
        if(!read){toast('请先阅读并勾选分销商申请协议');return}
        if(!name){toast('请输入真实姓名');return}
        if(!/^1\d{10}$/.test(mobile)){toast('请输入正确的 11 位手机号');return}
        btn.disabled=true;btn.textContent='提交中...';
        fetch('/h5/dealer/applySubmit.html',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'name='+encodeURIComponent(name)+'&mobile='+encodeURIComponent(mobile)})
            .then(function(r){return r.json()}).then(function(res){
                btn.disabled=false;btn.textContent='<?= $vw('submit', '申请成为经销商') ?>';
                if(res.code===1){toast('提交成功');setTimeout(function(){location.href=(res.data&&res.data.redirect)||'/index/dealer/apply.html'},600)}
                else{toast(res.msg||'提交失败')}
            }).catch(function(){btn.disabled=false;btn.textContent='<?= $vw('submit', '申请成为经销商') ?>';toast('网络异常，请稍后再试')});
    });
})();
</script>
<?php endif; ?>
