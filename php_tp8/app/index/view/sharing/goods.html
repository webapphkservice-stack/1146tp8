        <div class="field"><label for="addrSelect">收货地址</label><select id="addrSelect"><option value="">加载中...</option></select></div>
        <div class="no-addr" id="noAddr" hidden>暂无收货地址，请先<a href="/index/user/index.html">去个人中心添加</a>后再下单。</div>
        <div class="pay-row"><span>支付方式</span><strong>余额支付</strong></div>
        <div class="pay-amount"><span>应付金额</span><strong>¥<span id="payAmount"><?= number_format($sharingPrice, 2) ?></span></strong></div>
        <button class="btn" id="btnPay" type="button">确认支付</button>
    </div>
</div>
<script>
(function(){
    var GOODS_ID = <?= (int)($goods['goods_id'] ?? 0) ?>;
    var SPEC_SKU_ID = <?= json_encode($specSkuId) ?>;
    var PRICE = <?= number_format($sharingPrice, 2, '.', '') ?>;
    var STOCK = <?= $stock ?>;
    var qty = 1;
    var currentActiveId = 0;

    function toast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(function(){t.classList.remove('show')},2200)}
    function getToken(){try{return localStorage.getItem('h5_token')||new URLSearchParams(location.search).get('token')||''}catch(e){return ''}}
    function goLogin(){location.href='/index/passport/login.html?redirect='+encodeURIComponent(location.pathname+location.search)}
    function renderQty(){qty=Math.min(STOCK,Math.max(1,qty));document.getElementById('numVal').textContent=qty;document.getElementById('sumNum').textContent=qty;document.getElementById('payAmount').textContent=(PRICE*qty).toFixed(2)}

    var minus=document.getElementById('numMinus'),plus=document.getElementById('numPlus');
    if(minus)minus.addEventListener('click',function(){qty--;renderQty()});
    if(plus)plus.addEventListener('click',function(){qty++;renderQty()});

    var modal=document.getElementById('checkoutModal');
    function openCheckout(activeId){
        if(!getToken()){goLogin();return}
        currentActiveId=activeId||0;
        modal.classList.add('show');modal.setAttribute('aria-hidden','false');
        loadAddresses();
    }
    function closeCheckout(){modal.classList.remove('show');modal.setAttribute('aria-hidden','true')}

    function showNoAddr(msg){var n=document.getElementById('noAddr');n.hidden=false;if(msg)n.textContent=msg+'，请先';document.getElementById('addrSelect').closest('.field').style.display='none'}
    function loadAddresses(){
        var sel=document.getElementById('addrSelect');
        sel.innerHTML='<option value="">加载中...</option>';
        sel.closest('.field').style.display='';
        document.getElementById('noAddr').hidden=true;
        fetch('/api/address/lists?token='+encodeURIComponent(getToken())+'&wxapp_id=10001',{credentials:'same-origin'})
            .then(function(r){return r.json()})
            .then(function(d){
                if(d.code!==1){sel.innerHTML='';showNoAddr('地址加载失败');return}
                var list=d.data.list||[];
                if(!list.length){sel.innerHTML='';showNoAddr('暂无收货地址');return}
                sel.innerHTML='';
                list.forEach(function(a){
                    var reg=(a.region?(a.region.province||'')+(a.region.city||'')+(a.region.region||''):'');
                    var o=document.createElement('option');
                    o.value=a.address_id;
                    o.textContent=(a.name||'')+' '+(a.phone||'')+' '+reg+(a.detail||'');
                    if(String(a.address_id)===String(d.data.default_id))o.selected=true;
                    sel.appendChild(o);
                });
            })
            .catch(function(){sel.innerHTML='';showNoAddr('地址加载失败')});
    }

    var buy=document.getElementById('btnBuy');
    if(buy)buy.addEventListener('click',function(){openCheckout(0)});
    document.querySelectorAll('[data-join]').forEach(function(el){
        el.addEventListener('click',function(){openCheckout(parseInt(el.getAttribute('data-join'),10))});
    });
    document.querySelectorAll('[data-close]').forEach(function(el){el.addEventListener('click',closeCheckout)});

    var btnPay=document.getElementById('btnPay');
    btnPay.addEventListener('click',function(){
        var sel=document.getElementById('addrSelect');
        var addrId=sel.value;
        if(!addrId){toast('请先选择收货地址');return}
        btnPay.disabled=true;btnPay.textContent='支付中...';
        var fd=new FormData();
        fd.append('wxapp_id',10001);
        fd.append('token',getToken());
        fd.append('goods_id',GOODS_ID);
        fd.append('goods_sku_id',SPEC_SKU_ID);
        fd.append('goods_num',qty);
        fd.append('active_id',currentActiveId);
        fd.append('delivery',10);
        fd.append('address_id',addrId);
        fd.append('pay_type',10);
        fetch('/api/sharing.order/checkout',{method:'POST',body:fd,credentials:'same-origin'})
            .then(function(r){return r.json()})
            .then(function(d){
                btnPay.disabled=false;btnPay.textContent='确认支付';
                if(d.code===1){closeCheckout();toast(currentActiveId>0?'参团成功':'拼团成功');setTimeout(function(){location.href='/index/user/index.html'},900)}
                else{toast(d.msg||'下单失败')}
            })
            .catch(function(){btnPay.disabled=false;btnPay.textContent='确认支付';toast('网络异常，请稍后重试')});
    });
})();
</script>
</body>
