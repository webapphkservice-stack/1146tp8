<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>我的购物车 · 大料优选</title>
    <style>
        :root{--cream:#fef9f0;--green:#2d5016;--orange:#e8722a;--yellow:#f5c542;--brown:#8b4513;--muted:#8b7355;--pill:#d4e4bc;--white:#fff}
        *{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--green);font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;line-height:1.6}a{color:inherit;text-decoration:none}button{font:inherit;cursor:pointer}.wrap{width:min(1152px,calc(100% - 48px));margin:0 auto}.nav{position:sticky;top:0;z-index:20;background:rgba(254,249,240,.96);border-bottom:1px solid var(--pill);backdrop-filter:blur(10px)}.nav-inner{min-height:76px;display:flex;align-items:center;justify-content:space-between;gap:24px}.brand{font-size:23px;font-weight:800;display:flex;align-items:center;gap:10px}.brand-mark{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:50%;background:var(--pill);font-size:18px}.nav-links{display:flex;align-items:center;gap:26px;font-size:14px}.nav-links a:not(.btn):hover,.nav-links a.active{color:var(--orange)}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:11px 23px;border:0;border-radius:999px;background:var(--orange);color:#fff;font-weight:700}.btn:hover{background:#d96420}.btn:disabled{opacity:.5;cursor:not-allowed}.btn-light{background:var(--pill);color:var(--green)}.page-head{padding:46px 0 28px}.eyebrow{margin:0 0 9px;color:var(--orange);font-size:12px;font-weight:800;letter-spacing:2px}.page-head h1{font-size:40px;line-height:1.25;margin:0 0 8px}.page-head p{margin:0;color:var(--muted)}.cart-layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:28px;align-items:start;padding-bottom:64px}.cart-list{display:flex;flex-direction:column;gap:16px}.cart-item{display:grid;grid-template-columns:112px minmax(0,1fr) auto;gap:20px;padding:18px;background:#fff;border-radius:20px;box-shadow:0 2px 8px rgba(139,69,19,.07)}.cart-img{width:112px;height:112px;object-fit:cover;border-radius:14px;display:block}.cart-info{min-width:0}.cart-name{display:block;font-size:16px;font-weight:700;margin:3px 0 8px}.cart-name:hover{color:var(--orange)}.cart-spec{font-size:12px;color:var(--muted);margin:0 0 14px}.cart-price{display:inline-block;padding:4px 10px;border-radius:8px;background:var(--yellow);color:var(--brown);font-size:18px;font-weight:800}.cart-ctrl{display:flex;flex-direction:column;align-items:flex-end;justify-content:space-between;gap:16px}.qty{display:flex;align-items:center;border:1px solid var(--pill);border-radius:999px;overflow:hidden}.qty button{width:38px;height:38px;border:0;background:#fff;color:var(--green);font-size:19px}.qty button:hover{background:var(--pill)}.qty button:disabled{opacity:.4}.qty span{min-width:36px;text-align:center;font-weight:700}.delete{border:0;background:transparent;color:var(--muted);padding:3px;font-size:13px}.delete:hover{color:var(--orange)}.summary{position:sticky;top:100px;padding:26px;background:#fff;border-radius:22px;box-shadow:0 2px 10px rgba(139,69,19,.08)}.summary h2{font-size:22px;margin:0 0 22px}.summary-row{display:flex;justify-content:space-between;gap:20px;color:var(--muted);font-size:14px;margin:12px 0}.summary-total{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;border-top:1px solid var(--pill);padding-top:20px;margin-top:20px}.summary-total strong{font-size:28px;color:var(--brown)}.summary .btn{width:100%;margin-top:22px}.summary-note{text-align:center;color:var(--muted);font-size:12px;margin:12px 0 0}.empty,.status{padding:64px 24px;text-align:center;background:#fff;border-radius:22px;grid-column:1/-1}.empty h2,.status h2{margin:0 0 10px}.empty p,.status p{color:var(--muted);margin:0 0 24px}.footer{background:#fff;padding:34px 0;color:var(--muted);font-size:13px}.footer-inner{display:flex;align-items:center;justify-content:space-between;gap:20px}.footer-links{display:flex;gap:22px}.toast{position:fixed;left:50%;bottom:34px;z-index:50;transform:translate(-50%,14px);padding:12px 22px;border-radius:999px;background:var(--green);color:#fff;opacity:0;visibility:hidden;transition:.2s}.toast.show{opacity:1;visibility:visible;transform:translate(-50%,0)}
        @media(max-width:900px){.nav-links a:not(.btn){display:none}.cart-layout{grid-template-columns:1fr}.summary{position:static}.page-head h1{font-size:34px}}
        @media(max-width:520px){.wrap{width:calc(100% - 28px)}.nav-inner{min-height:64px}.brand{font-size:19px}.nav-links .btn{padding:9px 15px;font-size:12px;min-height:40px}.cart-item{grid-template-columns:88px minmax(0,1fr);gap:14px;padding:14px}.cart-img{width:88px;height:88px}.cart-ctrl{grid-column:1/-1;flex-direction:row;align-items:center}.footer-inner{align-items:flex-start;flex-direction:column}.footer-links{flex-wrap:wrap}}
    </style>
</head>
<body>
<nav class="nav" aria-label="主导航"><div class="wrap nav-inner"><a class="brand" href="/"><span class="brand-mark">大</span>大料优选</a><div class="nav-links"><a href="/">首页</a><a href="/index/goods/list.html">全部商品</a><a href="/h5/sharing/index.html">拼团</a><a href="/h5/bargain/index.html">砍价</a><a href="/index/user/index.html">个人中心</a><a class="btn active" href="/index/cart/index.html">购物车</a></div></div></nav>
<main class="wrap">
    <header class="page-head"><p class="eyebrow">FRESH MARKET · 我的购物车</p><h1>购物车</h1><p>核对商品与数量，准备带走你的精选好物。</p></header>
    <div class="cart-layout">
        <section class="cart-list" id="cartList" aria-live="polite"><div class="status"><h2>正在加载购物车</h2><p>请稍候。</p></div></section>
        <aside class="summary" id="summary" hidden><h2>订单汇总</h2><div class="summary-row"><span>商品件数</span><span id="totalNum">0 件</span></div><div class="summary-total"><span>合计</span><strong>¥<span id="totalPrice">0.00</span></strong></div><button class="btn" id="checkout" type="button">去结算</button><p class="summary-note">产地直供 · 认真打包 · 安心服务</p></aside>
    </div>
</main>
<footer class="footer"><div class="wrap footer-inner"><span>© <?= date('Y') ?> 大料优选 · 新鲜好物，每日直达</span><div class="footer-links"><a href="/">PC 首页</a><a href="/index/goods/list.html">全部商品</a><a href="/index/user/index.html">个人中心</a></div></div></footer>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
(function(){
    var listBox=document.getElementById('cartList'),summary=document.getElementById('summary'),busy=false;
    function getToken(){var url=new URL(location.href),query=url.searchParams.get('token');if(query){try{localStorage.setItem('h5_token',query)}catch(e){}url.searchParams.delete('token');history.replaceState(null,'',url.pathname+(url.searchParams.toString()?'?'+url.searchParams.toString():''));return query}try{return localStorage.getItem('h5_token')||''}catch(e){return''}}
    var userToken=getToken();
    function login(){location.href='/h5/passport/login.html?redirect='+encodeURIComponent(location.pathname+location.search)}
    function toast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(function(){t.classList.remove('show')},2200)}
    function request(path,options){options=options||{};options.credentials='same-origin';options.headers=Object.assign({'Content-Type':'application/x-www-form-urlencoded'},options.headers||{});return fetch('/api/'+path+(path.indexOf('?')>=0?'&':'?')+'wxapp_id=10001&token='+encodeURIComponent(userToken),options).then(function(r){return r.json()})}
    function node(tag,cls,text){var n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n}
    function empty(title,text,showLogin){listBox.textContent='';var box=node('div','empty');box.appendChild(node('h2','',title));box.appendChild(node('p','',text));var a=node('a','btn',showLogin?'去登录':'去逛逛');a.href=showLogin?'javascript:void(0)':'/index/goods/list.html';if(showLogin)a.addEventListener('click',login);box.appendChild(a);listBox.appendChild(box);summary.hidden=true}
    function render(items,totalNum){listBox.textContent='';var total=0;items.forEach(function(item){total+=Number(item.total_price||0);var row=node('article','cart-item');var imgLink=node('a');imgLink.href='/index/goods/detail.html?goods_id='+encodeURIComponent(item.goods_id);var img=node('img','cart-img');img.src=item.goods_image||'';img.alt=item.goods_name||'商品图片';imgLink.appendChild(img);row.appendChild(imgLink);var info=node('div','cart-info'),name=node('a','cart-name',item.goods_name||'商品');name.href=imgLink.href;info.appendChild(name);info.appendChild(node('p','cart-spec','商品规格 · 已选 '+item.total_num+' 件'));info.appendChild(node('span','cart-price','¥'+Number(item.goods_price||0).toFixed(2)));row.appendChild(info);var ctrl=node('div','cart-ctrl'),qty=node('div','qty');[['sub','−','减少数量'],['add','+','增加数量']].forEach(function(conf){var b=node('button','',conf[1]);b.type='button';b.title=conf[2];b.disabled=busy||(conf[0]==='sub'&&Number(item.total_num)<=1);b.addEventListener('click',function(){act(item,conf[0])});qty.appendChild(b);if(conf[0]==='sub')qty.appendChild(node('span','',item.total_num))});ctrl.appendChild(qty);var del=node('button','delete','删除');del.type='button';del.disabled=busy;del.addEventListener('click',function(){if(confirm('确定删除这件商品？'))act(item,'del')});ctrl.appendChild(del);row.appendChild(ctrl);listBox.appendChild(row)});document.getElementById('totalNum').textContent=totalNum+' 件';document.getElementById('totalPrice').textContent=total.toFixed(2);summary.hidden=items.length===0}
    function loadCart(){return request('cart/lists').then(function(d){if(d.code===-1){empty('请先登录','登录后即可查看购物车。',true);return}if(d.code!==1){empty('暂时无法加载',d.msg||'请稍后重试。',false);return}var items=d.data&&d.data.goods_list||[];if(!items.length){empty('购物车还是空的','去挑选一些新鲜好物吧。',false);return}render(items,Number(d.data.order_total_num||0))}).catch(function(){empty('网络异常','请检查网络后刷新重试。',false)})}
    function act(item,type){if(busy)return;busy=true;var path,body;if(type==='del'){path='cart/delete';body='goods_sku_id='+encodeURIComponent(item.goods_id+'_'+item.goods_sku_id)}else{path=type==='add'?'cart/add':'cart/sub';body='goods_id='+encodeURIComponent(item.goods_id)+'&goods_sku_id='+encodeURIComponent(item.goods_sku_id);if(type==='add')body+='&goods_num=1'}request(path,{method:'POST',body:body}).then(function(d){busy=false;if(d.code===-1){login();return}if(d.code!==1){toast(d.msg||'操作失败');return}loadCart()}).catch(function(){busy=false;toast('网络异常，请稍后重试')})}
    document.getElementById('checkout').addEventListener('click',function(){toast('结算功能正在建设中')});
    if(!userToken){empty('请先登录','登录后即可查看购物车。',true)}else{loadCart()}
})();
</script>
</body>
</html>
