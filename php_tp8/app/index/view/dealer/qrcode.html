<script>
(function(){
    var shareUrl=<?= json_encode($shareUrl) ?>;
    function toast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(function(){t.classList.remove('show')},2200)}
    function copyText(text){if(navigator.clipboard&&navigator.clipboard.writeText){return navigator.clipboard.writeText(text)}return new Promise(function(resolve,reject){var ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');resolve()}catch(e){reject(e)}document.body.removeChild(ta)})}
    document.getElementById('q-copy').addEventListener('click',function(){copyText(shareUrl).then(function(){toast('链接已复制')}).catch(function(){toast('复制失败，请手动选择复制')})});
    document.getElementById('q-share').addEventListener('click',function(){var abs=shareUrl.indexOf('http')===0?shareUrl:(location.origin+shareUrl);if(navigator.share){navigator.share({title:'分销推广',text:'加入我们的分销，一起赚佣金',url:abs}).catch(function(){})}else{copyText(shareUrl).then(function(){toast('链接已复制，快去分享给好友吧')})}});
})();
</script>
